<!doctype html>
<html lang="az" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XəzərStream IPTV — Həftəlik və Aylıq 4K Kanal Paketləri</title>
    <meta name="description" content="Həftəlik və aylıq paketlər, avtomatik Xtream Codes aktivasiyası, onlayn ödənişlər və 1200+ canlı kanal siyahısı ilə IPTV platforması." />
    <meta property="og:title" content="XəzərStream IPTV — Həftəlik və Aylıq 4K Kanal Paketləri" />
    <meta property="og:description" content="Həftəlik və aylıq paketlər, avtomatik Xtream Codes aktivasiyası, onlayn ödənişlər və 1200+ canlı kanal siyahısı ilə IPTV platforması." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background-color:#090B10;color:#F3F4F6;margin:0" class="bg-[#090B10] text-[#F3F4F6] antialiased selection:bg-amber-500/30 selection:text-amber-100">
    <div id="root">
      <div id="boot-fallback" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;">
        <div style="max-width:540px;background:#11151E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:24px;line-height:1.6;">
          <h2 style="margin:0 0 8px;color:#FBBF24;font-size:18px;">XəzərStream — Yükləmə Xətası</h2>
          <p style="margin:0 0 12px;color:#D1D5DB;font-size:14px;">
            GitHub Pages hazırda build olunmuş saytı deyil, xam mənbə fayllarını açır və ya skript yüklənməyib.
          </p>
          <p style="margin:0 0 12px;color:#9CA3AF;font-size:13px;">
            Həll: GitHub repozitoriyasında <strong>Settings → Pages → Build and deployment</strong> bölməsindən
            <strong>GitHub Actions</strong> və ya <strong>Branch: main / docs</strong> seçin (<code>/ (root)</code> deyil).
          </p>
          <pre id="boot-error-log" style="margin:0;padding:10px;background:#090B10;border-radius:8px;color:#FCA5A5;font-size:12px;overflow:auto;white-space:pre-wrap;"></pre>
        </div>
      </div>
    </div>
    <script>
      window.__bootErrors = [];
      (function () {
        var hasRawEntry = !!document.querySelector('script[src*="/src/main.tsx"]');
        var redirectTried = false;

        function tryRedirectToBuiltDocs() {
          if (redirectTried || !hasRawEntry || window.__APP_MOUNTED__) return;
          if (window.location.pathname.indexOf('/docs/') !== -1) return;
          redirectTried = true;
          fetch('./docs/index.html', { cache: 'no-store' })
            .then(function (res) {
              if (!res.ok) return '';
              return res.text();
            })
            .then(function (html) {
              if (html && html.indexOf('./assets/index-') !== -1 && !window.__APP_MOUNTED__) {
                window.location.replace('./docs/' + window.location.search + window.location.hash);
              }
            })
            .catch(function () {});
        }

        window.addEventListener(
          'error',
          function (e) {
            var target = e && e.target;
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              var src = target.src || target.href || target.tagName;
              window.__bootErrors.push('Fayl yüklənmədi: ' + src);
              if (src.indexOf('main.tsx') !== -1) {
                tryRedirectToBuiltDocs();
              }
            } else {
              window.__bootErrors.push((e && e.message) || 'Script load error');
            }
          },
          true
        );

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          window.__bootErrors.push((reason && reason.message) || String(reason || 'Unhandled promise rejection'));
        });

        function showBootFallbackIfUnmounted() {
          if (window.__APP_MOUNTED__) return;
          var el = document.getElementById('boot-fallback');
          if (el) {
            el.style.display = 'flex';
            var log = document.getElementById('boot-error-log');
            if (log) {
              log.textContent = window.__bootErrors.length
                ? window.__bootErrors.join('\n')
                : 'React quraşdırılmadı. URL: ' + window.location.href;
            }
          }
        }

        if (hasRawEntry) {
          setTimeout(tryRedirectToBuiltDocs, 800);
        }
        setTimeout(function () {
          if (window.__bootErrors.length > 0) showBootFallbackIfUnmounted();
        }, 1800);
        setTimeout(showBootFallbackIfUnmounted, 4500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
