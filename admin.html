<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XəzərStream — Admin Paneli</title>
    <style>
      body {
        margin: 0;
        background: #090b10;
        color: #f3f4f6;
        font-family: system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script>
      (function () {
        var host = window.location.hostname || '';
        var inDocs = window.location.pathname.indexOf('/docs/') !== -1;
        if (!inDocs && host.indexOf('github.io') !== -1) {
          fetch('./docs/index.html', { cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.text() : '';
            })
            .then(function (txt) {
              if (txt && txt.indexOf('./assets/index-') !== -1) {
                window.location.replace('./docs/#admin');
              } else {
                window.location.replace('./#admin');
              }
            })
            .catch(function () {
              window.location.replace('./#admin');
            });
        } else {
          window.location.replace('./#admin');
        }
      })();
    </script>
  </head>
  <body>
    <p>Admin Panelinə yönləndirilir...</p>
  </body>
</html>
